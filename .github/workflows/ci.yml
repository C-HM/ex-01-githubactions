name: CI Workflow

# Trigger on push to main branch [cite: 26]
on:
  push:
    branches: ["main"]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - uses: actions/checkout@v3

      # 2. Install NodeJS [cite: 27]
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      # 3. Install dependencies
      - name: Install dependencies
        run: npm install

      # 4. Execute Lint [cite: 28]
      - name: Run Lint
        run: npm run lint

      # 5. Create Artifact [cite: 29]
      # We are archiving the current directory (excluding node_modules via .gitignore usually,
      # but here we explicitly select files or pack them).
      - name: Archive Production Artifact
        uses: actions/upload-artifact@v3
        with:
          name: node-project-artifact
          path: |
            .
            !node_modules
